name: Сборка Android и Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Секреты не в git
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(dev\.cfg|export_credentials\.cfg|.+\.keystore|.+\.jks)$'; then
            echo "В репозитории лежит ключ или конфиг с секретом."
            exit 1
          fi

      - name: Godot 4.7.2 и шаблоны экспорта
        run: |
          set -euo pipefail
          version=4.7.2
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${version}-stable/Godot_v${version}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          install -m 755 "$RUNNER_TEMP/godot/Godot_v${version}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${version}-stable/Godot_v${version}-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          template_version="$(tr -d '[:space:]' < "$RUNNER_TEMP/templates/templates/version.txt")"
          dest="$HOME/.local/share/godot/export_templates/${template_version}"
          mkdir -p "$dest"
          cp -a "$RUNNER_TEMP/templates/templates/." "$dest/"
          godot --version

      - name: Тесты
        run: |
          set -euo pipefail
          godot --headless --path . --import
          godot --headless --path . -s res://tests/run_tests.gd

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Пакеты SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36" || sdkmanager "platforms;android-35"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Отладочный keystore
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -keystore "$keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Godot,C=US"
          mkdir -p .godot "$HOME/.config/godot"
          cat > .godot/export_credentials.cfg << EOF
          [preset.0]

          keystore/debug="${keystore}"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release="${keystore}"
          keystore/release_user="androiddebugkey"
          keystore/release_password="android"
          EOF
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          "export/android/java_sdk_path" = "${JAVA_HOME}"
          "export/android/android_sdk_path" = "${ANDROID_HOME}"
          "export/android/debug_keystore" = "${keystore}"
          "export/android/debug_keystore_user" = "androiddebugkey"
          "export/android/debug_keystore_pass" = "android"
          EOF
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${keystore}" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=${keystore}" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Экспорт
        run: |
          set -euo pipefail
          mkdir -p builds
          godot --headless --path . --export-release "Windows Desktop" "$PWD/builds/Detective.exe"
          godot --headless --path . --export-release "Android" "$PWD/builds/Detective.apk"
          test -s builds/Detective.exe
          test -s builds/Detective.pck
          test -s builds/Detective.apk

      - name: В сборке нет ключа и лишних файлов
        run: python3 tools/check_build.py builds/Detective.apk builds/Detective.pck

      - name: Архив Windows
        run: |
          set -euo pipefail
          cd builds
          zip -q Detective-windows.zip Detective.exe Detective.pck Detective.console.exe 2>/dev/null || zip -q Detective-windows.zip Detective.exe Detective.pck

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: detective-builds
          path: |
            builds/Detective.apk
            builds/Detective-windows.zip
          if-no-files-found: error

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            builds/Detective.apk
            builds/Detective-windows.zip
