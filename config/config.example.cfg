; Пример настроек. Настоящие настройки игра хранит в user://config.cfg
; (их пишет экран настроек). Для отладки на Windows можно скопировать этот файл
; в config/dev.cfg (он в .gitignore и не попадает в сборку) и вписать ключ.
; Описание полей — docs/LLM_PROTOCOL.md, раздел 8.

[llm]
provider="gemini"
api_key=""
dialogue_model="gemini-3.5-flash"
summary_model="gemini-3.5-flash-lite"
fallback_model="gemini-3.5-flash-lite"
thinking_level="LOW"
timeout_s=45
ping_timeout_s=32
min_interval_s=1.0

[voice]
enabled=true
provider="cloud"                     ; cloud | builtin
stt_mode="gemini_audio"              ; gemini_audio | cloud | builtin
cloud_vendor="gemini"
tts_model="gemini-3.8-flash-lite-tts"
volume=1.0
rate=1.0

[validator]
leak_max_stems=1
log_leaks=true

[debug]
log_prompts=false
