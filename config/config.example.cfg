; Пример настроек. Настоящие настройки игра хранит в user://config.cfg
; (их пишет экран настроек). Для отладки на Windows можно скопировать этот файл
; в config/dev.cfg (он в .gitignore и не попадает в сборку) и вписать ключ.
; Описание полей — docs/LLM_PROTOCOL.md, раздел 8.

[llm]
provider="gemini"
api_key=""
dialogue_model="gemini-3.5-flash-lite"
settings_version=3
thinking_level="MINIMAL"
summary_after_reply=true
local_fixes=true
timeout_s=45
ping_timeout_s=32

[voice]
; Озвучка реплик системным голосом. Микрофона в этом этапе нет.
enabled=false

[validator]
leak_max_stems=1
log_leaks=true

[debug]
log_prompts=false
